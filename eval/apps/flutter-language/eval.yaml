id: flutter-language
platform: flutter
sdk_packages: ["whisperr"]
build_checks: ["flutter analyze", "flutter test"]
# Event codes the SDK sends itself (whisperr-flutter lib/src/whisperr_client.dart).
# Lifecycle ones are automatic; screen_viewed comes from screen() and the push
# ones from the push helpers. A manual track() of any of them is a defect.
auto_events: [app_installed, app_updated, app_opened, app_backgrounded, screen_viewed, push_opened, push_permission_changed]

plan:
  - code: signup_completed
    name: Signup completed
    tier: must_have
    wireable_on: frontend
    payload_schema:
      type: object
      properties: {method: {type: string, enum: [email]}}
      required: [method]
      additionalProperties: false
    expect:
      files_any: ["lib/state/auth_controller.dart", "lib/screens/auth/signup_screen.dart", "lib/data/auth_repository.dart"]
      fires_on: [signup_ok, signup_ok_noconsent]
      not_on: [signup_taken]
      props: {method: string}

  - code: lesson_completed
    name: Lesson completed
    tier: must_have
    wireable_on: frontend
    payload_schema:
      type: object
      properties:
        lesson_id: {type: string}
        score_percent: {type: integer, minimum: 0, maximum: 100}
        xp_earned: {type: integer}
      required: [lesson_id, score_percent]
      additionalProperties: false
    expect:
      files_any: ["lib/state/progress_controller.dart", "lib/screens/lessons/lesson_screen.dart", "lib/screens/lessons/lesson_result_screen.dart", "lib/data/lesson_repository.dart"]
      fires_on: [core_action_x3]
      times: {core_action_x3: 3}   # the step finishes three lessons
      not_on: [anon_browse, onboarding_done, paywall_view]
      props: {lesson_id: string, score_percent: integer}

  - code: subscription_started
    name: Subscription started
    tier: must_have
    wireable_on: frontend
    payload_schema:
      type: object
      properties:
        plan_id: {type: string, enum: [premium_monthly, premium_annual]}
        price_cents: {type: integer}
        currency: {type: string}
        billing_period: {type: string, enum: [month, year]}
      required: [plan_id, price_cents, currency, billing_period]
      additionalProperties: false
    expect:
      files_any: ["lib/state/subscription_controller.dart", "lib/screens/billing/checkout_screen.dart", "lib/data/billing_repository.dart"]
      fires_on: [purchase_ok]
      not_on: [paywall_view, purchase_declined]
      props: {plan_id: string, price_cents: integer, currency: string, billing_period: string}

  - code: subscription_cancelled
    name: Subscription cancelled
    tier: must_have
    wireable_on: frontend
    payload_schema:
      type: object
      properties:
        plan_id: {type: string, enum: [premium_monthly, premium_annual]}
        reason: {type: string, enum: [too_expensive, not_using, too_hard, switching_app, other]}
      required: [plan_id, reason]
      additionalProperties: false
    expect:
      files_any: ["lib/state/subscription_controller.dart", "lib/screens/billing/cancel_subscription_screen.dart", "lib/data/billing_repository.dart"]
      fires_on: [cancel_with_reason]
      not_on: [purchase_ok, logout]
      props: {plan_id: string, reason: string}

  - code: onboarding_completed
    name: Onboarding completed
    tier: strong
    wireable_on: frontend
    payload_schema:
      type: object
      properties:
        learning_reason: {type: string, enum: [travel, work, family, culture]}
        level: {type: string, enum: [beginner, elementary, conversational]}
        daily_goal_minutes: {type: integer, enum: [5, 10, 15]}
      required: [learning_reason, level, daily_goal_minutes]
      additionalProperties: false
    expect:
      files_any: ["lib/screens/onboarding/onboarding_screen.dart", "lib/state/auth_controller.dart", "lib/data/auth_repository.dart"]
      fires_on: [onboarding_done]
      not_on: [signup_ok, signup_ok_noconsent]
      props: {learning_reason: string, level: string, daily_goal_minutes: integer}

  - code: paywall_viewed
    name: Paywall viewed
    tier: strong
    wireable_on: frontend
    payload_schema:
      type: object
      properties: {source: {type: string, enum: [home_banner, locked_lesson, profile]}}
      required: [source]
      additionalProperties: false
    expect:
      files_any: ["lib/screens/billing/paywall_screen.dart"]
      fires_on: [paywall_view]
      not_on: [purchase_declined, purchase_ok]
      props: {source: string}

  - code: payment_failed
    name: Payment failed
    tier: strong
    wireable_on: frontend
    payload_schema:
      type: object
      properties:
        plan_id: {type: string, enum: [premium_monthly, premium_annual]}
        reason: {type: string}
      required: [plan_id, reason]
      additionalProperties: false
    expect:
      files_any: ["lib/state/subscription_controller.dart", "lib/screens/billing/checkout_screen.dart", "lib/data/billing_repository.dart"]
      fires_on: [purchase_declined]
      not_on: [purchase_ok, paywall_view]
      props: {plan_id: string, reason: string}

  - code: logged_in
    name: Logged in
    tier: strong
    wireable_on: frontend
    payload_schema:
      type: object
      properties: {method: {type: string, enum: [email]}}
      required: [method]
      additionalProperties: false
    expect:
      files_any: ["lib/state/auth_controller.dart", "lib/screens/auth/login_screen.dart", "lib/data/auth_repository.dart"]
      fires_on: [login_ok]
      not_on: [restore, signup_ok, signup_ok_noconsent, signup_taken]   # a session restore is not a login
      props: {method: string}

  - code: lesson_previewed
    name: Lesson previewed
    tier: plausible
    wireable_on: frontend
    payload_schema:
      type: object
      properties: {lesson_id: {type: string}}
      required: [lesson_id]
      additionalProperties: false
    expect:
      files_any: ["lib/screens/lessons/lesson_preview_screen.dart"]
      fires_on: [anon_browse, logout, signup_ok_noconsent]
      not_on: [core_action_x3]
      props: {lesson_id: string}

  - code: daily_goal_reached
    name: Daily goal reached
    tier: plausible
    wireable_on: frontend
    payload_schema:
      type: object
      properties: {daily_goal_minutes: {type: integer, enum: [5, 10, 15]}}
      required: [daily_goal_minutes]
      additionalProperties: false
    expect:
      files_any: ["lib/state/progress_controller.dart", "lib/screens/lessons/lesson_result_screen.dart", "lib/screens/lessons/lesson_screen.dart"]
      fires_on: [core_action_x3]   # the 15-minute goal is reached by the third lesson, once
      not_on: [onboarding_done, paywall_view]
      props: {daily_goal_minutes: integer}

unplanned:
  - code: onboarding_skipped
  - code: logged_out

identity:
  user_id_from: fake_backend
  # Deterministic per email (lib/data/fake_backend.dart userIdForEmail).
  expected_user_ids:
    signup_ok: usr_340ea6c68e1f5eb8           # jane.eval@example.com
    signup_ok_noconsent: usr_c176f3c092ddd43e  # sam.noconsent@example.com
  identify_after: [signup_ok, login_ok, restore, signup_ok_noconsent]
  reset_after: [logout]
  # Jane logs back in during login_ok, so anonymous stitching moves the logout
  # step's events onto her whether or not the SDK was reset. The reset is
  # checked where a different person signs up next: in signup_ok_noconsent the
  # driver marks logout_at, cycles the app through background/foreground (the
  # SDK's own lifecycle events) and browses a lesson before Sam signs up.
  # Every event from logout_at to the end of that step must not resolve to
  # signup_ok's user.
  reset_check: {step: signup_ok_noconsent, after_mark: logout_at, not_user_of: signup_ok}
  anonymous_before: [anon_browse, signup_taken]
  consent:
    opt_in_step: signup_ok
    opt_out_step: signup_ok_noconsent
    # identify(email: ...) expands to an opted-in email channel in this SDK, so
    # using it for the opt-out user creates a consented channel.

pii_sentinels: ["jane.eval@example.com", "Jane Evalson", "Evalson", "+15555550123", "221B Eval Street", "sam.noconsent@example.com", "Sam Optout", "Optout"]
# Free text the driver types (cancel feedback); it must never be sent.
free_text_sentinels: ["Money is tight this month"]
allowed_traits: [first_name]
flows: [anon_browse, signup_taken, signup_ok, onboarding_done, core_action_x3, paywall_view, purchase_declined, purchase_ok, cancel_with_reason, logout, login_ok, restore, signup_ok_noconsent]
